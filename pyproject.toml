[project]
name = "workflow"
version = "0.1.0"
description = "A python package acts as an automated workspace manager that reads a TOML script to execute a sequence of file and folder operations."
readme = "README.md"
authors = [
    { name = "S-Astralcoder", email = "suraj.astralcode.ai@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pathvalidate>=3.3.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "send2trash>=2.1.0",
]

[project.scripts]
workflow = "workflow:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.pyright]
include = ["src", "tests"]
executionEnvironments = [
  { root = "src" }
]
typeCheckingMode = "strict"
